name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # The signing certificate is self-signed, so codesign can only build a valid chain if the
      # certificate is also trusted on the runner — importing it alone is not enough.
      - name: Import signing certificate
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MAC_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          LEGACY=()
          if openssl pkcs12 -help 2>&1 | grep -q -- '-legacy'; then LEGACY=(-legacy); fi
          openssl pkcs12 "${LEGACY[@]}" -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys \
            -out "$RUNNER_TEMP/cert.crt" -passin "pass:$MAC_CERT_PASSWORD"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          security default-keychain -s "$KEYCHAIN"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.crt"

          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.crt"

      - run: npm ci

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ZIP="dist/Clauide-$VERSION-arm64.zip"
          SHA256="$(shasum -a 256 "$ZIP" | cut -d' ' -f1)"

          git clone "https://x-access-token:$TAP_TOKEN@github.com/clauide/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cat > tap/Casks/clauide.rb <<EOF
          cask "clauide" do
            version "$VERSION"
            sha256 "$SHA256"

            url "https://github.com/clauide/clauide/releases/download/v#{version}/Clauide-#{version}-arm64.zip"
            name "Clauide"
            desc "Isolated Claude Code sessions in Docker containers"
            homepage "https://github.com/clauide/clauide"

            depends_on macos: ">= :monterey"
            depends_on arch: :arm64

            auto_updates true

            app "Clauide.app"

            zap trash: [
              "~/Library/Application Support/Clauide",
              "~/Library/Preferences/com.clauide.plist",
              "~/Library/Saved Application State/com.clauide.savedState",
            ]
          end
          EOF

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/clauide.rb
          git diff --cached --quiet && exit 0
          git commit -m "clauide $VERSION"
          git push
